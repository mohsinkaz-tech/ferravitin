version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 22
        - npm install --global bun@1.3.6
        - bun install --frozen-lockfile
    build:
      commands:
        - bun run build
  artifacts:
    baseDirectory: .amplify-hosting
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .bun/install/cache/**/*
