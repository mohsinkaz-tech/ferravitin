version: 1
applications:
  - appRoot: corporate
    frontend:
      phases:
        preBuild:
          commands:
            - nvm use 22
            - npm install --global bun@1.4.3
            - bun install --frozen-lockfile
        build:
          commands:
            - bun run build
      artifacts:
        baseDirectory: .amplify-hosting
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
  - appRoot: pharmacy
    frontend:
      phases:
        preBuild:
          commands:
            - nvm use 22
            - npm install --global bun@1.4.3
            - bun install --frozen-lockfile
        build:
          commands:
            - bun run build
      artifacts:
        baseDirectory: .amplify-hosting
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
