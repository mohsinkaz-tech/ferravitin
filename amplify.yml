version: 1
applications:
  - appRoot: corporate
    frontend:
      buildPath: /
      phases:
        preBuild:
          commands:
            - nvm use 22
        build:
          commands:
            - node --check shajara/site/site.js
            - cd shajara && node build.mjs
      artifacts:
        baseDirectory: shajara/.amplify-hosting
        files:
          - '**/*'