version: 1
applications:
  - appRoot: corporate
    frontend:
      buildPath: /
      phases:
        preBuild:
          commands:
            - nvm use 22
        build:
          commands:
            - node --check appeal/campaign.js
            - cd appeal && node build.mjs
      artifacts:
        baseDirectory: appeal/dist
        files:
          - '**/*'
  - appRoot: appeal
    frontend:
      phases:
        preBuild:
          commands:
            - nvm use 22
        build:
          commands:
            - node --check campaign.js
            - node build.mjs
      artifacts:
        baseDirectory: dist
        files:
          - '**/*'
